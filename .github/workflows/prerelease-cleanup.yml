name: Prerelease cleanup

# Every 0.2.0-pr.<n>.* this PR published goes when it closes, merged or
# not (docs/adr/0001). A site that merged while still pinned to one
# would break the next time its lockfile resolved from scratch, which
# is what the sites' own prerelease-pin check is there to prevent.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete this PR's prereleases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # the API names a scoped package without its scope
          PKG=0g-ui
          if ! gh api "/orgs/$ORG/packages/npm/$PKG" >/dev/null 2>&1; then
            echo "no published $PKG yet, nothing to clean"
            exit 0
          fi
          IDS=$(gh api "/orgs/$ORG/packages/npm/$PKG/versions" --paginate \
                  --jq ".[] | select(.name | test(\"-pr\\\\.${PR}\\\\.\")) | .id")
          if [ -z "$IDS" ]; then
            echo "no prereleases for PR #$PR"
            exit 0
          fi
          for ID in $IDS; do
            NAME=$(gh api "/orgs/$ORG/packages/npm/$PKG/versions/$ID" --jq .name)
            # the last remaining version of a package cannot be deleted
            gh api -X DELETE "/orgs/$ORG/packages/npm/$PKG/versions/$ID"
            echo "deleted $NAME"
            echo "deleted \`$NAME\`" >> "$GITHUB_STEP_SUMMARY"
          done
