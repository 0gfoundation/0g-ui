name: Prerelease

# A push to an open pull request publishes @0gfoundation/0g-ui at the
# version in packages/0g-ui/package.json with a prerelease identifier
# naming the PR and the run: 0.2.0-pr.2.7. Under the `pr` dist-tag, so
# it is never `latest`, and semver keeps it below the release it is
# built from. A site pins it exactly to get a preview of unreleased
# shell work (docs/adr/0001). Deleted when the PR closes.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: prerelease-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@0gfoundation"
      - run: pnpm install --frozen-lockfile

      # The run number, not the attempt or the sha: GitHub Packages
      # refuses a version that already exists, so a re-run of this
      # workflow must not land on what it published the first time
      - name: Version
        id: version
        env:
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
        run: |
          BASE=$(node -p "require('./packages/0g-ui/package.json').version")
          case "$BASE" in
            *-*)
              echo "packages/0g-ui/package.json is already a prerelease ($BASE)" >&2
              exit 1
              ;;
          esac
          VERSION="${BASE}-pr.${PR}.${RUN}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          node -e 'const f="packages/0g-ui/package.json",fs=require("fs"),p=JSON.parse(fs.readFileSync(f,"utf8"));p.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")' "$VERSION"

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Publish
        run: pnpm --filter @0gfoundation/0g-ui publish --no-git-checks --tag pr
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One comment per PR, rewritten on each push, so the thread does
      # not fill with superseded pins
      - name: Comment the pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARKER="<!-- 0g-ui-prerelease -->"
          {
            echo "$MARKER"
            echo "Prerelease published: \`$VERSION\`"
            echo
            echo "Pin it in the site PR that needs it:"
            echo
            echo '```json'
            echo "\"@0gfoundation/0g-ui\": \"$VERSION\""
            echo '```'
            echo
            echo "Then \`npm install\` (or \`pnpm install\`) to update the lockfile."
            echo "The site needs \`GH_PACKAGES_TOKEN\` in its environment and an"
            echo "\`.npmrc\` pointing the \`@0gfoundation\` scope at GitHub Packages."
            echo
            echo "Repin the site to the released version before it leaves draft:"
            echo "this prerelease is deleted when this PR closes."
          } > comment.md
          ID=$(gh api "/repos/$REPO/issues/$PR/comments" --paginate \
                 --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")
          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -F body=@comment.md >/dev/null
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi
          echo "Pinned as $VERSION" >> "$GITHUB_STEP_SUMMARY"
